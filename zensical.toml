[project]
site_name = "fair-ca-visualization"
site_url = "https://matthiaskoenig.github.io/fair-ca-visualization/"
site_description = "Interactive visualization of the FAIR COMBINE Archive Indicators (FAIR-CA)"
site_author = "Matthias König"
copyright = 'Copyright &copy; 2024-2026 <a href="https://livermetabolism.com">Matthias König</a>'
repo_url = "https://github.com/matthiaskoenig/fair-ca-visualization"
repo_name = "matthiaskoenig/fair-ca-visualization"
edit_uri = "edit/develop/docs/"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "User guide" = [
    { "Using the app" = "usage.md" },
    { "Assessing a model" = "assessment.md" },
    { "Adding an example assessment" = "adding-assessments.md" },
  ] },
  { "API reference" = [
    { "Overview" = "api/index.md" },
    { "fairvis" = [
      { "cli" = "api/cli.md" },
      { "data_io" = "api/data_io.md" },
      { "visualization" = "api/visualization.md" },
      { "settings" = "api/settings.md" },
      { "console" = "api/console.md" },
    ] },
  ] },
  { "Contributing" = "development.md" },
]

[project.plugins.exclude]
glob = ["superpowers/*", "README.md"]

[project.theme]
language = "en"
favicon = "images/favicon/favicon.ico"
logo = "images/favicon/fair-ca-100x100.png"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/fair-ca-visualization"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/fair-ca-visualization/"

[[project.extra.social]]
icon = "lucide/chart-bar"
link = "https://faircombine.streamlit.app"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = false
show_root_heading = false
show_root_toc_entry = false
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
filters = ["!^_"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
