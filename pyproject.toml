[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fair-ca-visualization"
# a static version: uv.lock records it, the uv of Streamlit Community Cloud
# cannot parse a uv.lock without it; kept current by bump-my-version
version = "0.4.0"
description = "Interactive visualization of the FAIR COMBINE Archive Indicators (FAIR-CA) for computational models."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
	"Topic :: Scientific/Engineering :: Visualization",
]
keywords = [
	"modeling",
	"standardization",
	"COMBINE",
	"FAIR",
	"indicators",
	"streamlit",
]
dependencies = [
	"numpy>=2.4.3",
	"openpyxl>=3.1.5",
	"pandas>=2.3.3,<3",
	"plotly>=6.6.0",
	"pyarrow>=23.0.1",
	"rich>=14.3.3",
	"streamlit>=1.55.0",
]

[project.scripts]
fairvis = "fairvis.cli:main"

[project.urls]
Homepage = "https://faircombine.streamlit.app"
Documentation = "https://matthiaskoenig.github.io/fair-ca-visualization"
Repository = "https://github.com/matthiaskoenig/fair-ca-visualization"
Issues = "https://github.com/matthiaskoenig/fair-ca-visualization/issues"
Changelog = "https://github.com/matthiaskoenig/fair-ca-visualization/tree/develop/release-notes"
Download = "https://pypi.org/project/fair-ca-visualization"

[dependency-groups]
# installed by `uv sync` by default; not part of the published metadata
dev = [
	"bump-my-version>=1.5.1",
	"mkdocstrings-python>=2.0.9",
	"pre-commit>=4.6.2",
	"pytest>=9.1.1",
	"pytest-xdist>=3.8.0",
	"ruff>=0.16.10",
	"ty>=0.0.84",
	"zensical>=0.0.67",
]

[tool.hatch.build.targets.wheel]
# the import package differs from the distribution name fair-ca-visualization
packages = ["src/fairvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# first-party modules live in the src layout; the checked python version is
# inferred from `project.requires-python`
root = ["./src"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true

[tool.pyright]
# pyright is not a check of the project, types are checked with ty; this only
# points the pyright language server of an editor or agent at the uv
# environment, so that the dependencies resolve
venvPath = "."
venv = ".venv"
