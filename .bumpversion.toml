[tool.bumpversion]
current_version = "0.5.1"
commit = true
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
# no tag: the bump is merged into develop through a pull request, which
# rewrites the commit, so the tag is created on develop afterwards
tag = false
sign_tags = false
tag_name = "{new_version}"
tag_message = "Bump version: {current_version} to {new_version}"
allow_dirty = false
message = "Bump version: {current_version} to {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "./pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "./uv.lock"
search = """
name = "fair-ca-visualization"
version = "{current_version}"
"""
replace = """
name = "fair-ca-visualization"
version = "{new_version}"
"""

[[tool.bumpversion.files]]
filename = "./src/fairvis/__init__.py"

[[tool.bumpversion.files]]
filename = "./CITATION.cff"
search = 'version: "{current_version}"'
replace = 'version: "{new_version}"'

[[tool.bumpversion.files]]
filename = "./tests/test_package.py"
