# Keep the GitHub Actions, the locked python dependencies and the pre-commit hooks up to date.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    # a single pull request for all action updates instead of one per action
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # the locked python dependencies (uv.lock), which Streamlit Community Cloud installs
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    # only uv.lock is updated, the lower bounds in pyproject.toml are changed by hand
    versioning-strategy: lockfile-only
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"

  # the hook revisions in .pre-commit-config.yaml (ruff and ty are also locked in uv.lock, see the ruff workflow)
  - package-ecosystem: "pre-commit"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
