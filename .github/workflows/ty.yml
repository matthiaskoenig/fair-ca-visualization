name: ty

on:
  push:
    # feature branches are checked through their pull request
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ty:
    # required by the branch protection, see .github/rulesets/develop.json
    name: ty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.21"
          python-version: "3.14"
          enable-cache: true
      - name: Install the locked dependencies (fails if uv.lock is out of date with pyproject.toml, run `uv lock`)
        # ty checks against the locked environment, i.e., the one the app runs in
        run: uv sync --locked
      - name: Type check
        env:
          # render diagnostics as GitHub Actions workflow annotations
          TY_OUTPUT_FORMAT: github
        run: uv run ty check
