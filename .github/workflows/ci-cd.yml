name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release and sync jobs raise what they need
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # superseded branch runs are cancelled, release runs are never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # the tools run with uvx are pinned, dependabot does not update them
  TWINE_VERSION: "7.0.0"
  # the standalone interpreters uv manages, not the ones of the runner image
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the app runs on the one python version of .python-version; the
        # platforms are those of the users who install the package locally
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "0.12.21"
        python-version: ${{ matrix.python-version }}
        # a release run restores no cache, which zizmor cannot tell from the
        # expression; the distributions are built without one, see `package`
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
    - name: Install the locked dependencies (fails if uv.lock is out of date with pyproject.toml, run `uv lock`)
      # the environment Streamlit Community Cloud installs, from the same uv.lock
      run: uv sync --locked
    - name: Test
      # the tests run on every core, the slowest are listed so they stay visible
      run: uv run pytest -n auto --durations=15

  package:
    # builds the distributions and runs the app from the installed wheel; on a
    # tag the distributions are the ones published, see `publish`
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # the history of develop, a release tag has to be on it
        fetch-depth: 0
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "0.12.21"
        python-version: "3.14"
        # a release is built from a clean state, never from a restored cache
        enable-cache: false
    - name: Check the release
      # the tagged commit is on develop, otherwise `sync-main` would move main
      # off develop; the tag, the version of the package and the citation agree,
      # and the release notes exist; checked before anything is published
      if: startsWith(github.ref, 'refs/tags/')
      env:
        TAG: ${{ github.ref_name }}
      run: |
        git merge-base --is-ancestor "${GITHUB_SHA}" origin/develop
        grep -qx "__version__ = \"${TAG}\"" src/fairvis/__init__.py
        grep -qx "version: \"${TAG}\"" CITATION.cff
        test -f "release-notes/${TAG}.md"
    - name: Build the package
      # --no-sources: built the way a user builds it, without uv specific sources
      run: uv build --no-sources
    - name: Check the package
      run: uvx "twine@${TWINE_VERSION}" check --strict dist/*
    - name: Run the app from the installed wheel
      run: scripts/smoke_test.sh dist/*.whl
    - name: Upload the distributions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not
    name: tests
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the results of the tests and the package
      env:
        TEST: ${{ needs.test.result }}
        PACKAGE: ${{ needs.package.result }}
      run: |
        echo "test matrix: $TEST, package: $PACKAGE"
        test "$TEST" = "success"
        test "$PACKAGE" = "success"

  publish:
    # the only job which can publish to PyPI, by trusted publishing through the
    # `pypi` environment; nothing is checked out and nothing is built here
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fair-ca-visualization
    permissions:
      id-token: write  # trusted publishing to PyPI
    steps:
    - name: Download the distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        packages-dir: dist/
        # PEP 740 attestations, signed with the identity of this workflow
        attestations: true

  github-release:
    # created once the package is on PyPI; Zenodo archives the release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Download the distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Create GitHub release
      # the GitHub cli of the runner, no third party action gets write access
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: >-
        gh release create "$TAG"
        --repo "$GITHUB_REPOSITORY"
        --verify-tag
        --title "fair-ca-visualization $TAG"
        --notes-file "release-notes/${TAG}.md"
        dist/*

  sync-main:
    # main tracks the latest release, Streamlit Community Cloud deploys from it,
    # see docs/development.md
    needs: [publish, github-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # a shallow clone cannot be pushed to another branch
        fetch-depth: 0
        # the push below needs the credentials, nothing else runs in this job
        persist-credentials: true
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
